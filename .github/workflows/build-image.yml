# Dựng ảnh Docker cho s7-be / s7-fe rồi đẩy lên ghcr.
#
# Kích bởi Worker `s7-builds-relay` (webhook push main của repo nguồn) — hoặc chạy tay khi cần:
#   gh workflow run build-image.yml --repo szen7dev/s7-builds -f app=be -f sha=<full sha>
#
# Tag `main-<run_id>-<sha7>`: run_id là của CHÍNH run này (dãy số toàn GitHub, luôn tăng) nên vẫn khớp
# `allowTags: ^main-[0-9]+-[0-9a-zA-Z]+$` + `updateStrategy: alphabetical` của ImageUpdater
# `prod-s7-01-kustomize-apps` (repo s7-kubernetes-prod) — phía GitOps không phải sửa gì.
#
# Kết quả gửi ngược về commit nguồn thành status `s7-builds/image` — push main mà ảnh không ra
# thì commit hiện ❌ chứ không im lặng như dispatch kiểu cũ.
name: build-image

on:
  workflow_dispatch:
    inputs:
      app:
        description: "be | fe"
        required: true
        type: choice
        options: [be, fe]
      sha:
        description: "Full commit SHA ở repo nguồn"
        required: true
        type: string
      ref_name:
        description: "Nhánh nguồn (tag ảnh bắt đầu bằng tên này)"
        required: false
        default: main
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: build-image-${{ inputs.app }}-${{ inputs.sha }}
  cancel-in-progress: false

jobs:
  build:
    # Chặn fork: repo public, chỉ chạy đúng repo gốc.
    if: github.repository == 'szen7dev/s7-builds'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SRC_REPO: szen7dev/s7-${{ inputs.app }}
      IMAGE: ghcr.io/szen7dev/s7-${{ inputs.app }}
      GH_TOKEN: ${{ secrets.SRC_TOKEN }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Status pending
        run: |
          gh api "repos/$SRC_REPO/statuses/${{ inputs.sha }}" -f state=pending -f context=s7-builds/image \
            -f description="Đang dựng ảnh" -f target_url="$RUN_URL" >/dev/null

      - uses: actions/checkout@v5
        with:
          repository: ${{ env.SRC_REPO }}
          ref: ${{ inputs.sha }}
          token: ${{ secrets.SRC_TOKEN }}
          persist-credentials: false

      - id: meta
        run: |
          TAG="${{ inputs.ref_name }}-${{ github.run_id }}-${GITHUB_SHA_SRC::7}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          {
            echo "tags<<EOF"
            echo "$IMAGE:$TAG"
            if [ "${{ inputs.ref_name }}" = "main" ]; then echo "$IMAGE:latest"; fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
        env:
          GITHUB_SHA_SRC: ${{ inputs.sha }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Cache để ở ghcr (package PRIVATE), KHÔNG dùng `type=gha`: cache Actions của repo public có thể bị
      # workflow từ PR fork đọc lại — mà lớp cache chứa mã nguồn private.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max

      - name: Status kết quả
        if: always()
        run: |
          case "${{ job.status }}" in
            success)   S=success; D="Đã đẩy ${{ steps.meta.outputs.tag }}" ;;
            cancelled) S=error;   D="Bị huỷ" ;;
            *)         S=failure; D="Dựng ảnh lỗi" ;;
          esac
          gh api "repos/$SRC_REPO/statuses/${{ inputs.sha }}" -f state=$S -f context=s7-builds/image \
            -f description="$D" -f target_url="$RUN_URL" >/dev/null
