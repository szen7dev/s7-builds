# Dựng ảnh Docker cho s7-be / s7-fe / s7-stt rồi đẩy lên ghcr.
#
# `stt` = worker Giọng nói → Văn bản (Python + faster-whisper, BR-07-155): mã ở `s7-be/workers/stt/`, ảnh RIÊNG
# `ghcr.io/szen7dev/s7-stt`, status riêng `s7-builds/image-stt` (không đè status ảnh API trên cùng commit).
#
# Kích bởi Worker `s7-builds-relay` (webhook push main của repo nguồn) — hoặc chạy tay khi cần:
#   gh workflow run build-image.yml --repo szen7dev/s7-builds -f app=be -f sha=<full sha>
#
# Tag `main-<run_id>-<sha7>`: run_id là của CHÍNH run này (dãy số toàn GitHub, luôn tăng) nên vẫn khớp
# `allowTags: ^main-[0-9]+-[0-9a-zA-Z]+$` + `updateStrategy: alphabetical` của ImageUpdater
# `prod-s7-01-kustomize-apps` (repo s7-kubernetes-prod) — phía GitOps không phải sửa gì.
#
# ⭐ LOI-0018 (2026-11-09): GitHub gửi webhook push TRỄ 1–2 giờ ⇒ commit CŨ được dựng sau commit mới, run_id lớn hơn ⇒
# ImageUpdater chọn ảnh cũ ⇒ prod s7-fe LÙI về ec10c7b. Từ nay: ảnh main đẩy trước với tag `sha-<run>-<sha7>`
# (ImageUpdater bỏ qua), rồi `ci/freshness.mjs` so commit với main — CHỈ khi sau nó không còn commit nào đổi tệp của
# ảnh mới gắn `main-…` + `latest` (và tag worker). Commit đã gắn `main-` rồi ⇒ job `check` bỏ qua lượt dựng trùng
# (webhook trễ tới sau khi `reconcile.yml` đã dựng) — trừ khi chạy tay với `force=true`.
#
# Kết quả gửi ngược về commit nguồn thành status `s7-builds/image` — push main mà ảnh không ra
# thì commit hiện ❌ chứ không im lặng như dispatch kiểu cũ. Kèm status `s7-builds/secrets` (gitleaks
# quét cây mã, KHÔNG chặn deploy).
#
# ⚠️ Repo PUBLIC — log build (Dockerfile, lỗi biên dịch có trích mã nguồn) KHÔNG in ra: xem `ci/lib.sh`.
# Token đọc repo nguồn (SRC_TOKEN) chỉ cấp cho bước checkout + bước gửi status, không lộ cho
# docker build hay action bên thứ ba. Action bên thứ ba ghim theo SHA.
name: build-image

on:
  workflow_dispatch:
    inputs:
      app:
        description: "be | fe | stt"
        required: true
        type: choice
        options: [be, fe, stt]
      sha:
        description: "Full commit SHA ở repo nguồn"
        required: true
        type: string
      ref_name:
        description: "Nhánh nguồn (tag ảnh bắt đầu bằng tên này)"
        required: false
        default: main
        type: string
      force:
        description: "Dựng lại cả khi commit này đã được gắn main- (mặc định bỏ qua lượt trùng)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

concurrency:
  group: build-image-${{ inputs.app }}-${{ inputs.sha }}
  cancel-in-progress: false

jobs:
  # LOI-0018 — commit này đã có ảnh gắn `main-` (status "Đã đẩy main-…") ⇒ không dựng lại (tránh khởi động lại pod lần hai).
  check:
    if: github.repository == 'szen7dev/s7-builds'
    runs-on: ubuntu-24.04
    outputs:
      dup: ${{ steps.dup.outputs.dup }}
    steps:
      - id: dup
        env:
          GH_TOKEN: ${{ secrets.SRC_TOKEN }}
          SRC_REPO: szen7dev/s7-${{ inputs.app == 'stt' && 'be' || inputs.app }}
          STATUS_CTX: ${{ inputs.app == 'stt' && 's7-builds/image-stt' || 's7-builds/image' }}
        run: |
          DUP=false
          if [ "${{ inputs.ref_name }}" = main ] && [ "${{ inputs.force }}" != true ]; then
            if gh api "repos/$SRC_REPO/commits/${{ inputs.sha }}/status?per_page=100" \
                 --jq ".statuses[] | select(.context == \"$STATUS_CTX\" and .state == \"success\") | .description" \
               | grep -q '^Đã đẩy main-'; then DUP=true; echo "Commit đã có ảnh main- — bỏ qua lượt dựng trùng"; fi
          fi
          echo "dup=$DUP" >> "$GITHUB_OUTPUT"

  build:
    needs: check
    # Chặn fork: repo public, chỉ chạy đúng repo gốc.
    if: github.repository == 'szen7dev/s7-builds' && needs.check.outputs.dup != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45  # stt tải sẵn mô hình Whisper ~1,6 GB vào ảnh
    env:
      # stt nằm trong repo s7-be (thư mục workers/stt) ⇒ checkout s7-be, dựng từ thư mục con.
      SRC_REPO: szen7dev/s7-${{ inputs.app == 'stt' && 'be' || inputs.app }}
      SRC_SHA: ${{ inputs.sha }}
      IMAGE: ghcr.io/szen7dev/s7-${{ inputs.app }}
      BUILD_CTX: ${{ inputs.app == 'stt' && 'workers/stt' || '.' }}
      STATUS_CTX: ${{ inputs.app == 'stt' && 's7-builds/image-stt' || 's7-builds/image' }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Nạp ci/lib.sh
        run: |
          B="https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/ci"
          curl -fsSL -o "$RUNNER_TEMP/lib.sh" "$B/lib.sh"
          mkdir -p "$RUNNER_TEMP/ci"
          curl -fsSL -o "$RUNNER_TEMP/ci/image-paths.mjs" "$B/image-paths.mjs"
          curl -fsSL -o "$RUNNER_TEMP/ci/freshness.mjs" "$B/freshness.mjs"

      - name: Status pending
        env:
          GH_TOKEN: ${{ secrets.SRC_TOKEN }}
        run: . "$RUNNER_TEMP/lib.sh" && status "$SRC_REPO" "$SRC_SHA" "$STATUS_CTX" pending "Đang dựng ảnh" "$RUN_URL"

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: ${{ env.SRC_REPO }}
          ref: ${{ inputs.sha }}
          token: ${{ secrets.SRC_TOKEN }}
          persist-credentials: false
          show-progress: false
          # be: lấy thêm commit cha để so tệp đổi (gắn tag worker — bước cuối).
          fetch-depth: ${{ inputs.app == 'be' && 2 || 1 }}

      - name: Quét bí mật (gitleaks)
        run: . "$RUNNER_TEMP/lib.sh" && gitleaks_scan .

      - id: meta
        run: |
          TAG="${{ inputs.ref_name }}-${{ github.run_id }}-${SRC_SHA::7}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "shatag=sha-${{ github.run_id }}-${SRC_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "$TAG" > "$RUNNER_TEMP/image-tag"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Gọi thẳng `docker buildx build` (không qua build-push-action) để: output vào file riêng tư,
      # không có bản ghi build/summary tự đính kèm run công khai.
      # Cache để ở ghcr (package PRIVATE), KHÔNG dùng `type=gha`: cache Actions của repo public có thể bị
      # workflow từ PR fork đọc lại — mà lớp cache chứa mã nguồn private.
      - name: Dựng + đẩy ảnh
        run: |
          . "$RUNNER_TEMP/lib.sh"
          # main: chỉ đẩy tag `sha-…` — `main-…`/`latest` gắn ở bước "Gắn tag main-" SAU khi kiểm độ mới (LOI-0018).
          if [ "${{ inputs.ref_name }}" = "main" ]; then TAGS=(-t "$IMAGE:${{ steps.meta.outputs.shatag }}"); else TAGS=(-t "$IMAGE:${{ steps.meta.outputs.tag }}"); fi
          quiet docker-build docker buildx build "$BUILD_CTX" --push --progress=plain "${TAGS[@]}" \
            --cache-from "type=registry,ref=$IMAGE:buildcache" \
            --cache-to "type=registry,ref=$IMAGE:buildcache,mode=max" \
            || { set_desc "Dựng ảnh lỗi — log mã hoá trong artifact của run"; exit 1; }
          set_desc "Đã đẩy ${{ inputs.ref_name == 'main' && steps.meta.outputs.shatag || steps.meta.outputs.tag }}"

      - name: Kiểm độ mới so với main
        id: fresh
        if: inputs.ref_name == 'main'
        env:
          GH_TOKEN: ${{ secrets.SRC_TOKEN }}
          APP: ${{ inputs.app }}
        run: |
          . "$RUNNER_TEMP/lib.sh"
          node "$RUNNER_TEMP/ci/freshness.mjs" \
            || { set_desc "Không kiểm được độ mới — đã đẩy ${{ steps.meta.outputs.shatag }}, CHƯA gắn main-; chạy lại tay"; exit 1; }

      - name: Gắn tag main- (chỉ khi là bản mới nhất)
        if: inputs.ref_name == 'main'
        run: |
          . "$RUNNER_TEMP/lib.sh"
          if [ "${{ steps.fresh.outputs.latest }}" = true ]; then
            quiet main-tag docker buildx imagetools create -t "$IMAGE:${{ steps.meta.outputs.tag }}" -t "$IMAGE:latest" "$IMAGE:${{ steps.meta.outputs.shatag }}" \
              || { set_desc "Gắn tag main- lỗi (ảnh ở ${{ steps.meta.outputs.shatag }})"; exit 1; }
            set_desc "Đã đẩy ${{ steps.meta.outputs.tag }}"
          else
            set_desc "Không gắn main- (${{ steps.fresh.outputs.reason }}) — main có bản mới hơn; ảnh lưu ${{ steps.meta.outputs.shatag }}"
          fi

      # ⭐ 2026-11-08 (chủ dự án: "chỉ khởi động lại worker khi code worker đổi") — ảnh s7-be dùng chung cho API + worker Chat. Trước: mỗi lần
      # gộp đều nâng tag cho cả `s7-be-zalo-worker` ⇒ worker Zalo/Telegram/Email khởi động lại, kết nối lại 1–2 phút, tin gửi lúc đó nằm chờ.
      # Nay: commit đụng bao đóng import của worker (`scripts/worker-deps.mjs` trong s7-be) hoặc thư viện/Dockerfile/integrations ⇒ gắn THÊM
      # tag `worker-<run>-<sha>` cho CHÍNH ảnh vừa đẩy (không dựng lại); ImageUpdater chỉ đưa tag `worker-*` vào worker (repo GitOps).
      # Không so được (thiếu commit cha / thiếu script) ⇒ coi như có đổi — phía an toàn. Không in tên tệp (repo public).
      - name: Gắn tag worker khi code worker đổi
        if: inputs.app == 'be' && inputs.ref_name == 'main' && steps.fresh.outputs.latest == 'true'
        run: |
          . "$RUNNER_TEMP/lib.sh"
          AFFECTED=yes
          if [ -f scripts/worker-deps.mjs ] && git rev-parse -q --verify HEAD~1 >/dev/null; then
            CHANGED=$(git diff --name-only HEAD~1 HEAD | tr '\n' ' ')
            AFFECTED=$(node scripts/worker-deps.mjs --changed $CHANGED 2>/dev/null || echo yes)
          fi
          if [ "$AFFECTED" != "no" ]; then
            WTAG="worker-${{ github.run_id }}-${SRC_SHA::7}"
            quiet worker-tag docker buildx imagetools create -t "$IMAGE:$WTAG" "$IMAGE:${{ steps.meta.outputs.tag }}" \
              || { set_desc "Đã đẩy ${{ steps.meta.outputs.tag }} — gắn tag worker lỗi"; exit 1; }
            set_desc "Đã đẩy ${{ steps.meta.outputs.tag }} + $WTAG (worker đổi)"
          else
            set_desc "Đã đẩy ${{ steps.meta.outputs.tag }} (worker không đổi)"
          fi

      - name: Đóng gói log (mã hoá)
        if: failure()
        env:
          LOG_KEY: ${{ secrets.LOG_KEY }}
        run: . "$RUNNER_TEMP/lib.sh" && pack_logs

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: logs-encrypted
          path: ${{ runner.temp }}/logs.enc
          retention-days: 1
          if-no-files-found: ignore

      - name: Status kết quả
        if: always()
        env:
          GH_TOKEN: ${{ secrets.SRC_TOKEN }}
        run: |
          . "$RUNNER_TEMP/lib.sh"
          # Huỷ ⇒ `pending`, và KHÔNG đoán lý do (xem `job_state` ở ci/lib.sh).
          [ "${{ job.status }}" = cancelled ] && set_desc "Bị huỷ giữa chừng, chưa biết việc dựng ảnh ra sao. Chạy lại để biết."
          status "$SRC_REPO" "$SRC_SHA" "$STATUS_CTX" "$(job_state "${{ job.status }}")" "Dựng ảnh lỗi" "$RUN_URL"
          [ -f "$RUNNER_TEMP/gitleaks-count" ] && gitleaks_status "$SRC_REPO" "$SRC_SHA" "$RUN_URL" || true
