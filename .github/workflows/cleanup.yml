# Repo này PUBLIC: log run ai cũng đọc được. Lớp chặn CHÍNH là không in mã private ra log
# (`ci/lib.sh` — chỉ dòng ✔/✖, chi tiết vào status commit private + artifact MÃ HOÁ); dọn run ở đây
# là lớp phụ để không tích tụ.
# - Run XANH: xoá ngay khi xong.
# - Run ĐỎ/HUỶ: giữ tối đa ~1 ngày (artifact log mã hoá cũng hết hạn sau 1 ngày) để kịp xem lỗi
#   bằng `scripts/xem-log.sh <run_id>`, rồi lượt quét hằng đêm xoá.
name: cleanup

on:
  workflow_run:
    workflows: [build-image, test-be, ci-app]
    types: [completed]
  schedule:
    - cron: '0 17 * * *'   # 00:00 giờ VN
  workflow_dispatch: {}

permissions:
  actions: write

jobs:
  cleanup:
    if: github.repository == 'szen7dev/s7-builds'
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      R: ${{ github.repository }}
    steps:
      - name: Xoá run vừa xanh
        if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
        run: gh api -X DELETE "repos/$R/actions/runs/${{ github.event.workflow_run.id }}"

      - name: Quét mọi run đã xong (trừ chính run này)
        if: github.event_name != 'workflow_run'
        run: |
          gh api "repos/$R/actions/runs?status=completed&per_page=100" --paginate \
            --jq '.workflow_runs[].id' | grep -vx "${{ github.run_id }}" | \
            xargs -r -I {} gh api -X DELETE "repos/$R/actions/runs/{}"
