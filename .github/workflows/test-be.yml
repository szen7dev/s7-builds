# Kiểm tra s7-be: gate + toàn bộ test (MongoDB replica set riêng).
# 2026-11-08: BỎ job `checklist` — chủ dự án chuyển ghi nhận yêu cầu sang Grow Lab (s7-be CLAUDE.md), không ép checklist git nữa.
# Thay cho `test.yml` + `checklist.yml` cũ chạy trong repo private (≈ 4.500 phút tính phí/tuần).
#
# Kích bởi Worker `s7-builds-relay`: push main (đổi src/scripts/test/...) và mọi PR mở/cập nhật.
# Chạy tay:  gh workflow run test-be.yml --repo szen7dev/s7-builds -f sha=<full sha> [-f base=main]
#
# Kết quả gửi về commit nguồn: status `s7-builds/test`.
#
# ⚠️ Repo PUBLIC — output gate/test (đường dẫn + dòng mã private, tên collection, tên nhánh) KHÔNG
# in ra log: xem `ci/lib.sh`. Tên file test đỏ chỉ gửi về status trên commit private. SRC_TOKEN chỉ
# cấp cho checkout/fetch/status — `npm ci` (script cài đặt của thư viện) không đọc được.
name: test-be

on:
  workflow_dispatch:
    inputs:
      sha:
        description: "Full commit SHA ở s7-be"
        required: true
        type: string
      base:
        description: "Nhánh đích của PR (để trống nếu là push)"
        required: false
        default: ""
        type: string
      key:
        description: "Khoá gom run (pr-<số> hoặc main) — run cũ cùng khoá bị huỷ"
        required: false
        default: manual
        type: string

permissions:
  contents: read

concurrency:
  group: test-be-${{ inputs.key }}
  cancel-in-progress: true

env:
  SRC_REPO: szen7dev/s7-be
  SRC_SHA: ${{ inputs.sha }}
  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

jobs:
  backend:
    if: github.repository == 'szen7dev/s7-builds'
    runs-on: ubuntu-24.04
    # ⚠️ LOI-0019: bộ test ~8.900 bài chạy 22–29 phút — trần 30 nằm NGAY TRÊN khoảng đó, nên một
    # runner chạy chậm hơn thường ngày là PR bị giết giữa chừng. Giữ khớp với TRAN_PHUT ở bước cuối.
    timeout-minutes: 45
    steps:
      - name: Nạp ci/lib.sh
        run: |
          curl -fsSL -o "$RUNNER_TEMP/lib.sh" "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/ci/lib.sh"
          date +%s > "$RUNNER_TEMP/bat-dau"   # mốc để bước cuối biết là quá giờ hay bị lần chạy mới đẩy ra

      - name: Status pending
        env:
          GH_TOKEN: ${{ secrets.SRC_TOKEN }}
        run: . "$RUNNER_TEMP/lib.sh" && status "$SRC_REPO" "$SRC_SHA" s7-builds/test pending "Đang chạy gate + test" "$RUN_URL"

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: ${{ env.SRC_REPO }}
          ref: ${{ inputs.sha }}
          token: ${{ secrets.SRC_TOKEN }}
          persist-credentials: false
          show-progress: false

      # Gate so đặc tả với nhánh main ⇒ cần lịch sử + ref `main`. Fetch IM LẶNG (checkout với
      # fetch-depth: 0 in tên MỌI nhánh ra log công khai); token chỉ sống trong lệnh này.
      - name: Lấy lịch sử + nhánh main
        env:
          T: ${{ secrets.SRC_TOKEN }}
        run: |
          H="$(printf 'x-access-token:%s' "$T" | base64 -w0)"; echo "::add-mask::$H"
          git -c http.extraheader="AUTHORIZATION: basic $H" fetch -q --no-tags --unshallow origin \
            '+refs/heads/main:refs/remotes/origin/main'
          git show-ref --verify --quiet refs/heads/main || git branch -q main origin/main
          echo "✔ đã lấy lịch sử"

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: npm

      - name: Cài đặt
        run: . "$RUNNER_TEMP/lib.sh" && quiet npm-ci npm ci --no-audit --no-fund || { set_desc "npm ci lỗi"; exit 1; }

      - name: Start isolated MongoDB replica set
        run: |
          docker run -d --name s7-test-mongo -p 27018:27018 mongo:7 --port 27018 --replSet rs0 --bind_ip_all >/dev/null
          for attempt in $(seq 1 60); do
            if docker exec s7-test-mongo mongosh --port 27018 --quiet --eval 'db.runCommand({ping:1}).ok' 2>/dev/null | grep -q 1; then break; fi
            sleep 1
          done
          docker exec s7-test-mongo mongosh --port 27018 --quiet --eval 'rs.initiate({_id:"rs0",members:[{_id:0,host:"127.0.0.1:27018"}]})' >/dev/null
          for attempt in $(seq 1 60); do
            if docker exec s7-test-mongo mongosh --port 27018 --quiet --eval 'db.hello().isWritablePrimary' | grep -q true; then echo "✔ mongo sẵn sàng"; exit 0; fi
            sleep 1
          done
          exit 1

      # JWT_SECRET sinh ngẫu nhiên mỗi lần chạy — không để chuỗi giống khoá trong file public.
      # Khoá S3 dưới đây là GIẢ (test không gọi S3 thật).
      - name: Configure isolated test database
        run: |
          cat > .env.test <<'ENV'
          MONGO_URI=mongodb://127.0.0.1:27018/?replicaSet=rs0
          MONGO_DB=acc_test
          PORT=4401
          MAIL_DRIVER=log
          DOCS_DIR=
          FE_DIR=
          SECRET_BOX_KEY=
          S3_ENDPOINT=https://sgp1.digitaloceanspaces.com
          S3_REGION=sgp1
          S3_BUCKET=s7-prod-store-test
          S3_ACCESS_KEY=test-access-key
          S3_SECRET_KEY=test-secret-key
          S3_FORCE_PATH_STYLE=false
          ENV
          echo "JWT_SECRET=$(openssl rand -hex 32)" >> .env.test
          cp .env.test .env

      - name: Gate + test
        run: |
          . "$RUNNER_TEMP/lib.sh"
          quiet gate npm run gate || { set_desc "Gate đỏ — log mã hoá trong artifact của run"; exit 1; }
          rc=0; quiet test npm test || rc=$?
          P=$(grep -E '^# pass ' "$LOGDIR/test.log" | tail -1 | awk '{print $3}')
          F=$(grep -E '^# fail ' "$LOGDIR/test.log" | tail -1 | awk '{print $3}')
          echo "test: pass ${P:-?} · fail ${F:-?}"
          if [ "$rc" != 0 ]; then
            # Tên FILE test đỏ: dòng `location:` ngay sau mỗi `not ok` cấp ngoài cùng của TAP.
            BAD=$(awk '/^not ok /{f=1;next} f&&/^  location:/{print;f=0}' "$LOGDIR/test.log" \
              | sed -E "s#.*/test/#test/#; s#:[0-9]+:[0-9]+'\$##" | sort -u | paste -sd, -)
            set_desc "fail ${F:-?}: ${BAD:-xem log mã hoá}"
            exit 1
          fi
          set_desc "Gate + test xanh (pass ${P:-?})"

      - name: Đóng gói log (mã hoá)
        if: failure()
        env:
          LOG_KEY: ${{ secrets.LOG_KEY }}
        run: |
          . "$RUNNER_TEMP/lib.sh"
          docker logs --tail 200 s7-test-mongo > "$LOGDIR/mongo.log" 2>&1 || true
          pack_logs

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: logs-encrypted
          path: ${{ runner.temp }}/logs.enc
          retention-days: 1
          if-no-files-found: ignore

      - name: Status kết quả
        if: always()
        env:
          GH_TOKEN: ${{ secrets.SRC_TOKEN }}
        run: |
          . "$RUNNER_TEMP/lib.sh"
          # ⚠️ LOI-0019: GitHub báo job.status = cancelled cho CẢ HAI đường — bị lần chạy mới đẩy ra, VÀ
          # bị chính CI giết vì quá giờ. Phân biệt bằng thời gian chạy: chạm trần ⇒ nói chắc là quá giờ.
          # Còn lại KHÔNG khẳng định lý do (s7-be YC-0265): "có lần chạy mới hơn" là đoán — job còn bị huỷ vì
          # người bấm huỷ, hàng đợi, hết hạn mức. Nói chắc một điều chưa kiểm đã làm mất thời gian thật khi truy PR đỏ.
          TRAN_PHUT=45   # giữ khớp với timeout-minutes của job
          if [ "${{ job.status }}" = cancelled ]; then
            batdau="$(cat "$RUNNER_TEMP/bat-dau" 2>/dev/null || echo 0)"
            phut=$(( ( $(date +%s) - batdau ) / 60 ))
            if [ "$batdau" -gt 0 ] && [ "$phut" -ge $(( TRAN_PHUT - 2 )) ]; then
              set_desc "QUÁ GIỜ: chạy $phut phút, CI tự giết ở trần $TRAN_PHUT phút — KHÔNG phải do lần chạy mới"
            else
              set_desc "Bị huỷ giữa chừng, chưa biết gate/test ra sao. Chạy lại để biết."
            fi
          fi
          status "$SRC_REPO" "$SRC_SHA" s7-builds/test "$(job_state "${{ job.status }}")" "Gate/test đỏ" "$RUN_URL"
